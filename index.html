<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Coder — type anything, write real code</title>
<style>
  :root {
    --bg: #000000;
    --fg: #d4d4d4;
    --dim: #4a4a58;
    --accent: #39ff9b;
    --kw: #ff5ea0;      /* keywords      */
    --str: #ffd75f;     /* strings       */
    --num: #b58cff;     /* numbers       */
    --com: #5f6a7d;     /* comments      */
    --fn: #4fc3f7;      /* function names*/
    --op: #ff8c42;      /* operators     */
    --id: #9cffb0;      /* identifiers   */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body {
    font-family: "SF Mono", "Fira Code", "Cascadia Code", Consolas, Menlo, monospace;
    color: var(--fg);
  }

  /* ---------- editor surface ---------- */
  #screen {
    position: absolute; inset: 0 0 34px 0;
    overflow-y: auto;
    padding: 28px 36px;
    font-size: 16px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #screen::-webkit-scrollbar { width: 0; }

  .tok-kw  { color: var(--kw);  }
  .tok-str { color: var(--str); }
  .tok-num { color: var(--num); }
  .tok-com { color: var(--com); font-style: italic; }
  .tok-fn  { color: var(--fn);  }
  .tok-op  { color: var(--op);  }
  .tok-id  { color: var(--id);  }

  #cursor {
    display: inline-block;
    width: 9px; height: 1.15em;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
    box-shadow: 0 0 8px var(--accent);
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- status bar ---------- */
  #statusbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 34px;
    display: flex; align-items: center; gap: 24px;
    padding: 0 20px;
    background: #07070c;
    border-top: 1px solid #16161f;
    font-size: 12.5px;
    color: var(--dim);
    user-select: none;
  }
  #statusbar .lit { color: var(--accent); }
  #statusbar .right { margin-left: auto; display: flex; gap: 24px; }

  /* ---------- start / menu overlay ---------- */
  #overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.92);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  #panel {
    width: min(640px, 92vw);
    border: 1px solid #1e1e2c;
    border-radius: 10px;
    background: #050509;
    padding: 34px 38px;
    box-shadow: 0 0 60px rgba(57,255,155,0.07);
  }
  #panel h1 {
    font-size: 22px; font-weight: 600; letter-spacing: 1px;
    margin-bottom: 6px;
  }
  #panel h1 .flash { color: var(--accent); }
  #panel p.sub { color: var(--dim); font-size: 13px; margin-bottom: 22px; }

  label.field { display: block; color: var(--dim); font-size: 12px; margin: 16px 0 6px; letter-spacing: 0.5px; text-transform: uppercase; }
  #describe {
    width: 100%; background: #0b0b12; color: var(--fg);
    border: 1px solid #1e1e2c; border-radius: 6px;
    font: inherit; font-size: 14px;
    padding: 10px 12px; resize: none; height: 64px; outline: none;
  }
  #describe:focus { border-color: var(--accent); }

  #programs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .prog {
    border: 1px solid #1e1e2c; border-radius: 6px;
    padding: 10px 12px; cursor: pointer;
    background: #0b0b12;
  }
  .prog:hover { border-color: #3a3a52; }
  .prog.sel { border-color: var(--accent); box-shadow: 0 0 12px rgba(57,255,155,0.15); }
  .prog .t { font-size: 13.5px; color: var(--fg); }
  .prog .d { font-size: 11.5px; color: var(--dim); margin-top: 3px; }
  .prog .lang { float: right; font-size: 10.5px; color: var(--num); }

  /* ---------- Ask AI ---------- */
  #aiRow { display: flex; gap: 8px; margin-top: 8px; }
  #apiKey {
    flex: 1; background: #0b0b12; color: var(--fg);
    border: 1px solid #1e1e2c; border-radius: 6px;
    font: inherit; font-size: 13px;
    padding: 8px 12px; outline: none;
  }
  #apiKey:focus { border-color: var(--num); }
  #aiBtn {
    background: transparent; color: var(--num);
    border: 1px solid var(--num); border-radius: 6px;
    font: inherit; font-size: 13px; font-weight: 700;
    padding: 8px 16px; cursor: pointer; white-space: nowrap;
  }
  #aiBtn:hover { background: rgba(181,140,255,0.1); }
  #aiBtn:disabled { opacity: 0.5; cursor: wait; }
  #aiStatus { font-size: 12px; margin-top: 8px; min-height: 16px; color: var(--dim); }
  #aiStatus.err { color: #ff6b6b; }
  #aiStatus.ok { color: var(--accent); }

  #startBtn {
    margin-top: 24px; width: 100%;
    background: var(--accent); color: #000;
    border: none; border-radius: 6px;
    font: inherit; font-size: 15px; font-weight: 700;
    padding: 12px; cursor: pointer; letter-spacing: 1px;
  }
  #startBtn:hover { filter: brightness(1.15); }
  #panel .hint { text-align: center; color: var(--dim); font-size: 11.5px; margin-top: 14px; }

  /* ---------- completion banner ---------- */
  .buildline { color: var(--accent); }
  .buildline.dim { color: var(--dim); }

  /* ---------- hidden input: summons the mobile keyboard ---------- */
  #ghost {
    position: fixed; top: 0; left: 0;
    width: 2px; height: 2px;
    opacity: 0.01;
    border: none; outline: none;
    background: transparent; color: transparent;
    caret-color: transparent;
    font-size: 16px; /* prevents iOS zoom-on-focus */
  }

  #menuBtn { cursor: pointer; }
  #menuBtn:hover { color: var(--fg); text-decoration: underline; }

  /* ---------- run overlay: watch the program actually work ---------- */
  #runOverlay {
    position: fixed; inset: 0; z-index: 20;
    background: #000;
    display: flex; flex-direction: column;
  }
  #runOverlay.hidden { display: none; }
  #runHead {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid #16161f;
    font-size: 13px; color: var(--dim);
    flex: none;
  }
  #runCmd { color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #runClose {
    margin-left: auto; cursor: pointer; flex: none;
    color: var(--fg); font-size: 13px;
    padding: 5px 12px;
    border: 1px solid #1e1e2c; border-radius: 6px; background: #0b0b12;
  }
  #runClose:hover { border-color: var(--accent); }
  #runBody {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: auto; padding: 10px;
  }
  #runBody canvas { image-rendering: pixelated; touch-action: none; }
  #runBody pre {
    margin: 0; font-size: 11px; line-height: 1.12;
    color: #9cffb0; white-space: pre;
  }
  #runBody iframe { width: 100%; height: 100%; border: none; background: #fff; }

  .runBtn {
    display: inline-block;
    color: #000; background: var(--accent);
    padding: 2px 12px; border-radius: 4px;
    cursor: pointer; font-weight: 700;
  }
  .runBtn:hover { filter: brightness(1.15); }

  /* ---------- small screens ---------- */
  @media (max-width: 640px) {
    #screen { padding: 16px 14px; font-size: 14px; }
    #panel { padding: 22px 18px; }
    #programs { grid-template-columns: 1fr; }
    #aiRow { flex-direction: column; }
    #statusbar { gap: 12px; font-size: 11px; }
  }
</style>

`#!/usr/bin/env python3
"""Conway's Game of Life -- terminal edition. Run: python3 life.py"""
import os
import random
import time

WIDTH, HEIGHT = 60, 24
ALIVE, DEAD = "#", " "


def random_grid():
    return [[random.random() < 0.25 for _ in range(WIDTH)]
            for _ in range(HEIGHT)]


def neighbours(grid, x, y):
    count = 0
    for dy in (-1, 0, 1):
        for dx in (-1, 0, 1):
            if dx == 0 and dy == 0:
                continue
            nx, ny = (x + dx) % WIDTH, (y + dy) % HEIGHT
            count += grid[ny][nx]
    return count


def step(grid):
    new = [[False] * WIDTH for _ in range(HEIGHT)]
    for y in range(HEIGHT):
        for x in range(WIDTH):
            n = neighbours(grid, x, y)
            new[y][x] = n == 3 or (grid[y][x] and n == 2)
    return new


def draw(grid, generation):
    os.system("cls" if os.name == "nt" else "clear")
    print("Game of Life  --  generation", generation)
    for row in grid:
        print("".join(ALIVE if cell else DEAD for cell in row))


def main():
    grid = random_grid()
    generation = 0
    try:
        while True:
            draw(grid, generation)
            grid = step(grid)
            generation += 1
            time.sleep(0.08)
    except KeyboardInterrupt:
        print("\\nGoodbye.")


if __name__ == "__main__":
    main()
`

`#!/usr/bin/env python3
"""Classic Snake. Run: python3 snake.py  (arrow keys, q to quit)"""
import curses
import random


def main(stdscr):
    curses.curs_set(0)
    stdscr.nodelay(True)
    stdscr.timeout(90)
    h, w = stdscr.getmaxyx()

    snake = [(h // 2, w // 4 + i) for i in range(3)]
    direction = (0, -1)
    food = (h // 2, w // 2)
    score = 0

    while True:
        key = stdscr.getch()
        turns = {
            curses.KEY_UP: (-1, 0), curses.KEY_DOWN: (1, 0),
            curses.KEY_LEFT: (0, -1), curses.KEY_RIGHT: (0, 1),
        }
        if key in turns:
            dy, dx = turns[key]
            if (dy, dx) != (-direction[0], -direction[1]):
                direction = (dy, dx)
        elif key == ord("q"):
            break

        head = (snake[0][0] + direction[0], snake[0][1] + direction[1])
        if (head in snake or head[0] in (0, h - 1)
                or head[1] in (0, w - 1)):
            break
        snake.insert(0, head)

        if head == food:
            score += 1
            while food in snake:
                food = (random.randint(1, h - 2),
                        random.randint(1, w - 2))
        else:
            snake.pop()

        stdscr.clear()
        stdscr.border()
        stdscr.addstr(0, 2, " score: %d " % score)
        stdscr.addch(food[0], food[1], "*")
        for y, x in snake:
            stdscr.addch(y, x, "O")
        stdscr.refresh()

    return score


if __name__ == "__main__":
    final = curses.wrapper(main)
    print("Game over -- final score:", final)
`

 * Build: cc -O2 -o mandelbrot mandelbrot.c
 * Run:   ./mandelbrot
 */
#include <stdio.h>

#define COLS 100
#define ROWS 38
#define MAX_ITER 96

static const char SHADES[] = " .:-=+*#%@";

int main(void)
{
    int row, col, i;
    double cr, ci, zr, zi, zr2, zi2;

    for (row = 0; row < ROWS; row++) {
        ci = -1.2 + 2.4 * row / (ROWS - 1);
        for (col = 0; col < COLS; col++) {
            cr = -2.1 + 3.0 * col / (COLS - 1);
            zr = zi = zr2 = zi2 = 0.0;
            for (i = 0; i < MAX_ITER; i++) {
                zi = 2.0 * zr * zi + ci;
                zr = zr2 - zi2 + cr;
                zr2 = zr * zr;
                zi2 = zi * zi;
                if (zr2 + zi2 > 4.0)
                    break;
            }
            putchar(SHADES[i == MAX_ITER ? 9 : i % 10]);
        }
        putchar('\\n');
    }
    return 0;
}

`#!/usr/bin/env node
// matrix.js -- digital rain for your terminal. Run: node matrix.js
// Ctrl+C to exit.

const GLYPHS = "01ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄABCDEFXYZ<>*+-=";
const cols = process.stdout.columns || 80;
const rows = process.stdout.rows || 24;

const drops = Array.from({ length: cols }, function () {
  return {
    y: Math.floor(Math.random() * rows),
    speed: 1 + Math.floor(Math.random() * 3),
  };
});

function glyph() {
  return GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
}

function frame() {
  let out = "";
  for (let x = 0; x < cols; x++) {
    const d = drops[x];
    if (Math.random() < 0.7) continue;
    const headY = d.y % rows;
    const tailY = (d.y - d.speed + rows * 4) % rows;
    // bright head, dim tail, erase behind
    out += "\\x1b[" + (headY + 1) + ";" + (x + 1) + "H\\x1b[97m" + glyph();
    out += "\\x1b[" + (tailY + 1) + ";" + (x + 1) + "H\\x1b[32m" + glyph();
    const gone = (d.y - d.speed * 6 + rows * 8) % rows;
    out += "\\x1b[" + (gone + 1) + ";" + (x + 1) + "H ";
    d.y += d.speed;
  }
  process.stdout.write(out);
}

process.stdout.write("\\x1b[2J\\x1b[?25l"); // clear screen, hide cursor
const timer = setInterval(frame, 50);

process.on("SIGINT", function () {
  clearInterval(timer);
  process.stdout.write("\\x1b[0m\\x1b[2J\\x1b[H\\x1b[?25h");
  console.log("Wake up, Neo...");
  process.exit(0);
});

"""Tiny sphere ray tracer. Run: python3 raytracer.py  ->  out.ppm"""
import math

W, H = 320, 240
LIGHT = (-0.6, 0.8, -0.5)

SPHERES = [
    # (cx, cy, cz, radius, (r, g, b))
    (0.0, -0.2, 3.0, 0.8, (255, 80, 120)),
    (-1.4, 0.1, 3.6, 0.6, (90, 200, 255)),
    (1.3, 0.0, 3.4, 0.7, (255, 210, 80)),
]


def normalize(v):
    n = math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2])
    return (v[0] / n, v[1] / n, v[2] / n)


def dot(a, b):
    return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]


def hit_sphere(origin, direction, sphere):
    cx, cy, cz, radius, _ = sphere
    oc = (origin[0] - cx, origin[1] - cy, origin[2] - cz)
    b = 2.0 * dot(oc, direction)
    c = dot(oc, oc) - radius * radius
    disc = b * b - 4.0 * c
    if disc < 0:
        return None
    t = (-b - math.sqrt(disc)) / 2.0
    return t if t > 0.001 else None


def trace(direction):
    nearest, best = None, float("inf")
    for sphere in SPHERES:
        t = hit_sphere((0, 0, 0), direction, sphere)
        if t is not None and t < best:
            nearest, best = sphere, t
    if nearest is None:
        fade = 0.5 * (direction[1] + 1.0)
        return (int(20 + 40 * fade), int(20 + 40 * fade), int(40 + 80 * fade))
    cx, cy, cz, _, color = nearest
    point = (direction[0] * best, direction[1] * best, direction[2] * best)
    normal = normalize((point[0] - cx, point[1] - cy, point[2] - cz))
    lam = max(0.0, dot(normal, normalize(LIGHT)))
    spec = lam ** 24
    return tuple(min(255, int(c * (0.15 + 0.85 * lam) + 200 * spec))
                 for c in color)


def main():
    with open("out.ppm", "w") as img:
        img.write("P3\\n%d %d\\n255\\n" % (W, H))
        for y in range(H):
            for x in range(W):
                dx = (2.0 * x / W - 1.0) * (W / float(H))
                dy = 1.0 - 2.0 * y / H
                r, g, b = trace(normalize((dx, dy, 1.6)))
                img.write("%d %d %d\\n" % (r, g, b))
    print("wrote out.ppm -- open it with any image viewer")


if __name__ == "__main__":
    main()
`

`#!/usr/bin/env node
// server.js -- zero-dependency HTTP server. Run: node server.js
const http = require("http");
const url = require("url");

const PORT = process.env.PORT || 8080;
const started = new Date();
let hits = 0;

const routes = {
  "/": function (req, res) {
    send(res, 200, "text/html",
      "<h1>It works.</h1><p>Try <a href='/api/status'>/api/status</a></p>");
  },
  "/api/status": function (req, res) {
    send(res, 200, "application/json", JSON.stringify({
      ok: true,
      uptimeSeconds: Math.floor((Date.now() - started) / 1000),
      hits: hits,
      node: process.version,
    }, null, 2));
  },
  "/api/echo": function (req, res) {
    const query = url.parse(req.url, true).query;
    send(res, 200, "application/json", JSON.stringify(query, null, 2));
  },
};

function send(res, status, type, body) {
  res.writeHead(status, {
    "Content-Type": type,
    "Content-Length": Buffer.byteLength(body),
  });
  res.end(body);
}

const server = http.createServer(function (req, res) {
  hits += 1;
  const path = url.parse(req.url).pathname;
  const handler = routes[path];
  console.log(new Date().toISOString(), req.method, path);
  if (handler) {
    handler(req, res);
  } else {
    send(res, 404, "application/json",
      JSON.stringify({ error: "not found", path: path }));
  }
});

server.listen(PORT, function () {
  console.log("listening on http://localhost:" + PORT);
});

    lineComment: "//",
    blockComment: true,
    htmlComment: true,
    tripleQuote: false,
  },
};

function tokenize(code, lang) {
  const def = LANG_DEFS[lang] || LANG_DEFS.javascript;
  const kw = new Set(def.keywords);
  const tokens = [];
  let i = 0;
  const n = code.length;

  function push(text, cls) {
    if (text) tokens.push({ text: text, cls: cls });
  }

  while (i < n) {
    const ch = code[i];

    // HTML comments: <!-- ... -->
    if (def.htmlComment && code.startsWith("<!--", i)) {
      let j = code.indexOf("-->", i + 4);
      j = j === -1 ? n : j + 3;
      push(code.slice(i, j), "com"); i = j; continue;
    }

    // block comments: /* ... */ (C) and """ ... """ (Python)
    if (def.blockComment && ch === "/" && code[i + 1] === "*") {
      let j = code.indexOf("*/", i + 2);
      j = j === -1 ? n : j + 2;
      push(code.slice(i, j), "com"); i = j; continue;
    }
    if (def.tripleQuote && code.startsWith('"""', i)) {
      let j = code.indexOf('"""', i + 3);
      j = j === -1 ? n : j + 3;
      push(code.slice(i, j), "com"); i = j; continue;
    }

    // line comments
    if (def.lineComment && code.startsWith(def.lineComment, i) &&
        !(lang === "c" && def.lineComment === "#")) {
      let j = code.indexOf("\n", i);
      if (j === -1) j = n;
      push(code.slice(i, j), "com"); i = j; continue;
    }
    if (lang === "c" && ch === "#") { // preprocessor
      let j = code.indexOf("\n", i);
      if (j === -1) j = n;
      push(code.slice(i, j), "kw"); i = j; continue;
    }

    // strings
    if (ch === '"' || ch === "'") {
      let j = i + 1;
      while (j < n && code[j] !== ch) {
        if (code[j] === "\\") j++;
        j++;
      }
      j = Math.min(j + 1, n);
      push(code.slice(i, j), "str"); i = j; continue;
    }

    // numbers
    if (/[0-9]/.test(ch)) {
      let j = i;
      while (j < n && /[0-9.xa-fA-F]/.test(code[j])) j++;
      push(code.slice(i, j), "num"); i = j; continue;
    }

    // identifiers / keywords / function calls
    if (/[A-Za-z_]/.test(ch)) {
      let j = i;
      while (j < n && /[A-Za-z0-9_]/.test(code[j])) j++;
      const word = code.slice(i, j);
      let k = j;
      while (k < n && code[k] === " ") k++;
      const cls = kw.has(word) ? "kw"
                : code[k] === "(" ? "fn"
                : "id";
      push(word, cls); i = j; continue;
    }

    // operators & punctuation
    if (/[+\-*\/%=<>!&|^~?:;,.(){}\[\]]/.test(ch)) {
      push(ch, "op"); i++; continue;
    }

    // whitespace & anything else
    let j = i;
    while (j < n && /\s/.test(code[j]) ) j++;
    if (j === i) j = i + 1;
    push(code.slice(i, j), null); i = j;
  }
  return tokens;
}

/* =====================================================================
   App state & typing engine
   ===================================================================== */
const screen  = document.getElementById("screen");
const codeEl  = document.getElementById("code");
const overlay = document.getElementById("overlay");
const stFile  = document.getElementById("st-file");
const stLang  = document.getElementById("st-lang");
const stWpm   = document.getElementById("st-wpm");
const stPct   = document.getElementById("st-pct");

let tokens = [];        // [{text, cls}]
let totalChars = 0;
let revealed = 0;       // chars revealed so far
let tokenIdx = 0;       // current token being revealed
let tokenPos = 0;       // chars of current token already out
let currentSpan = null; // live span we're appending into
let running = false;
let finished = false;
let startTime = null;
let selectedId = null;
let currentProg = null;   // the program being typed (library entry or AI-generated)

const COMMENT_PREFIX = { python: "# ", javascript: "// ", c: "// " };

function buildSource(prog, description) {
  let header = "";
  if (description.trim()) {
    const p = COMMENT_PREFIX[prog.lang] || "// ";
    header = description.trim().split("\n")
      .map(function (l) { return p + l; }).join("\n") + "\n\n";
  }
  return header + prog.code;
}

function loadProgram(prog, description) {
  currentProg = prog;
  const source = buildSource(prog, description);
  tokens = tokenize(source, prog.lang);
  totalChars = source.length;
  revealed = 0; tokenIdx = 0; tokenPos = 0; currentSpan = null;
  finished = false; startTime = null;
  codeEl.innerHTML = "";
  stFile.textContent = "~/projects/" + prog.file;
  stLang.textContent = prog.lang;
  stPct.textContent = "0%";
  stWpm.textContent = "0";
}

function newSpan(cls) {
  const s = document.createElement("span");
  if (cls) s.className = "tok-" + cls;
  codeEl.appendChild(s);
  return s;
}

/* One keystroke reveals exactly one character, instantly — the output
   is perfectly synchronized with the typist's real speed. */
function revealNow(count) {
  if (finished) return;
  if (!startTime) startTime = Date.now();
  let left = count;
  while (left > 0 && tokenIdx < tokens.length) {
    const tok = tokens[tokenIdx];
    if (!currentSpan) currentSpan = newSpan(tok.cls);
    const take = Math.min(left, tok.text.length - tokenPos);
    currentSpan.textContent += tok.text.substr(tokenPos, take);
    tokenPos += take; revealed += take; left -= take;
    if (tokenPos >= tok.text.length) {
      tokenIdx++; tokenPos = 0; currentSpan = null;
    }
  }
  screen.scrollTop = screen.scrollHeight;
  updateStatus();
  if (tokenIdx >= tokens.length) complete();
}

function unrevealChars(count) {
  if (finished || revealed === 0) return;
  revealed = Math.max(0, revealed - count);
  // rebuild up to `revealed` — backspace is rare, full rebuild is fine
  codeEl.innerHTML = "";
  currentSpan = null; tokenIdx = 0; tokenPos = 0;
  let left = revealed;
  revealed = 0;
  if (left > 0) revealNow(left);
  else updateStatus();
}

function updateStatus() {
  stPct.textContent = Math.floor(100 * revealed / totalChars) + "%";
  if (startTime) {
    const mins = (Date.now() - startTime) / 60000;
    if (mins > 0.005) {
      stWpm.textContent = Math.min(9999, Math.round((revealed / 5) / mins));
    }
  }
}

function runCommandFor(prog) {
  return prog.lang === "c"
    ? "cc -O2 -o app " + prog.file + " && ./app"
    : prog.lang === "html"
    ? "open " + prog.file
    : (prog.lang === "python" ? "python3 " : "node ") + prog.file;
}

function complete() {
  finished = true;
  const done = document.createElement("div");
  const prog = currentProg;
  done.innerHTML =
    '\n\n<span class="buildline dim">$ ' + runCommandFor(prog) + '</span>' +
    '\n<span class="buildline">✓ compiled clean — 0 errors, 0 warnings</span>' +
    (hasDemo(prog)
      ? '\n<span class="buildline"><span class="runBtn" id="runBtn">▶ RUN IT</span> <span class="buildline dim">watch it work (or press Enter)</span></span>'
      : '') +
    '\n<span class="buildline dim">press ESC to write another program</span>';
  codeEl.appendChild(done);
  if (hasDemo(prog)) {
    document.getElementById("runBtn").addEventListener("click", runDemo);
  }
  screen.scrollTop = screen.scrollHeight;
}

/* =====================================================================
   Description → program matching
   ===================================================================== */
function matchProgram(description) {
  const words = description.toLowerCase().match(/[a-z]+/g) || [];
  let best = null, bestScore = 0;
  PROGRAMS.forEach(function (p) {
    const hay = (p.tags.join(" ") + " " + p.title + " " + p.desc).toLowerCase();
    let score = 0;
    words.forEach(function (w) {
      if (w.length > 2 && hay.indexOf(w) !== -1) score++;
    });
    if (score > bestScore) { best = p; bestScore = score; }
  });
  return best;  // null when nothing matches — caller decides what to do
}

/* =====================================================================
   Menu wiring
   ===================================================================== */
const programsEl = document.getElementById("programs");
PROGRAMS.forEach(function (p) {
  const div = document.createElement("div");
  div.className = "prog";
  div.dataset.id = p.id;
  div.innerHTML = '<span class="lang">' + p.lang + '</span>' +
    '<div class="t">' + p.title + '</div><div class="d">' + p.desc + '</div>';
  div.addEventListener("click", function () {
    document.querySelectorAll(".prog").forEach(function (el) {
      el.classList.remove("sel");
    });
    div.classList.add("sel");
    selectedId = p.id;
  });
  programsEl.appendChild(div);
});

/* =====================================================================
   Ask AI — Claude writes a real program from the description
   ===================================================================== */
const apiKeyEl = document.getElementById("apiKey");
const aiBtn = document.getElementById("aiBtn");
const aiStatus = document.getElementById("aiStatus");
apiKeyEl.value = localStorage.getItem("speedcoder_api_key") || "";

function setAiStatus(msg, cls) {
  aiStatus.textContent = msg;
  aiStatus.className = cls || "";
}

async function generateWithAI(description, apiKey) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-opus-5",
      max_tokens: 8192,
      output_config: {
        effort: "low",
        format: {
          type: "json_schema",
          schema: {
            type: "object",
            properties: {
              filename: { type: "string" },
              language: { type: "string", enum: ["python", "javascript", "c", "html"] },
              code: { type: "string" },
            },
            required: ["filename", "language", "code"],
            additionalProperties: false,
          },
        },
      },
      system: "You write short, complete, runnable code snippets for a " +
        "fake-typing app. Write the SHORTEST clean program that does " +
        "EXACTLY what the user describes - follow the description " +
        "literally and add nothing they did not ask for: no extra " +
        "features, no animations, no styling flourishes, no configuration " +
        "options. Typically 10-40 lines. Choose the best-fitting language: " +
        "python (3, stdlib only), javascript (Node, no dependencies), " +
        "c (compiles with cc), or html (one file, inline CSS/JS; use html " +
        "whenever they describe a web page or anything visual). It must " +
        "run as-is. Start with a one-line comment saying what it does.",
      messages: [{ role: "user", content: description }],
    }),
  });
  const data = await res.json();
  if (!res.ok) {
    throw new Error((data.error && data.error.message) || ("HTTP " + res.status));
  }
  if (data.stop_reason === "refusal") {
    throw new Error("The AI declined this request - try describing something else.");
  }
  if (data.stop_reason === "max_tokens") {
    throw new Error("Program came out too long - try asking for something simpler.");
  }
  const text = data.content.filter(function (b) { return b.type === "text"; })
    .map(function (b) { return b.text; }).join("");
  return JSON.parse(text);
}

aiBtn.addEventListener("click", async function () {
  const description = document.getElementById("describe").value.trim();
  const apiKey = apiKeyEl.value.trim();
  if (!description) {
    setAiStatus("Describe what the program should do first (box 1).", "err");
    return;
  }
  if (!apiKey) {
    setAiStatus("Paste your Claude API key - it is only stored in this browser.", "err");
    return;
  }
  localStorage.setItem("speedcoder_api_key", apiKey);
  aiBtn.disabled = true;
  setAiStatus("AI is writing your program…", "ok");
  focusGhost();  // must happen inside the tap gesture for iOS to show the keyboard
  try {
    const result = await generateWithAI(description, apiKey);
    const prog = {
      id: "ai",
      title: "AI: " + description.slice(0, 40),
      lang: result.language,
      file: result.filename,
      code: result.code.endsWith("\n") ? result.code : result.code + "\n",
    };
    setAiStatus("Done - start typing!", "ok");
    selectedId = "ai";
    loadProgram(prog, "");  // AI code already reflects the description
    overlay.classList.add("hidden");
    running = true;
    document.getElementById("describe").blur();
    focusGhost();
  } catch (err) {
    setAiStatus("AI error: " + err.message, "err");
    ghost.blur();
  } finally {
    aiBtn.disabled = false;
  }
});

document.getElementById("startBtn").addEventListener("click", start);

function start() {
  const description = document.getElementById("describe").value;
  let prog = PROGRAMS.find(function (p) { return p.id === selectedId; });
  if (!prog) {
    prog = matchProgram(description);
    if (!prog) {
      if (description.trim()) {
        // don't start a random program the user didn't describe
        setAiStatus("No library program matches that description - tap " +
          "✦ ASK AI to have Claude write it, or pick a program above.", "err");
        return;
      }
      prog = PROGRAMS[Math.floor(Math.random() * PROGRAMS.length)];
    }
    selectedId = prog.id;
  }
  loadProgram(prog, description);
  overlay.classList.add("hidden");
  running = true;
  document.getElementById("describe").blur();
  focusGhost();  // summons the on-screen keyboard on mobile
}

function openMenu() {
  running = false;
  closeDemo();
  overlay.classList.remove("hidden");
  ghost.blur();  // dismiss the mobile keyboard
  // deselect so a fresh description can re-match next time
  document.querySelectorAll(".prog").forEach(function (el) {
    el.classList.remove("sel");
  });
  selectedId = null;
}

/* =====================================================================
   Run overlay — the payoff: the finished program actually works.
   Library programs get faithful JS re-implementations; AI-written HTML
   runs for real in a sandboxed iframe.
   ===================================================================== */
const runOverlay = document.getElementById("runOverlay");
const runBody = document.getElementById("runBody");
const runCmdEl = document.getElementById("runCmd");
let demoCleanup = null;

function hasDemo(prog) {
  return !!DEMOS[prog.id] || prog.lang === "html";
}

function fitSquare() {
  return Math.min(runBody.clientWidth, runBody.clientHeight) - 8;
}

function makeCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  runBody.appendChild(c);
  return c;
}

function runDemo() {
  const prog = currentProg;
  if (!prog || !finished || !hasDemo(prog)) return;
  ghost.blur();  // free the screen (and hide the mobile keyboard)
  runOverlay.classList.remove("hidden");
  runBody.innerHTML = "";
  runCmdEl.textContent = "$ " + runCommandFor(prog);
  let demoKeys = null;

  function onKey(e) {
    e.stopPropagation();  // don't let the typing handler see demo keys
    if (e.key === "Escape") { closeDemo(); return; }
    if (demoKeys) demoKeys(e);
  }
  document.addEventListener("keydown", onKey, true);

  let innerCleanup = null;
  if (DEMOS[prog.id]) {
    const d = DEMOS[prog.id]();
    innerCleanup = d.cleanup;
    demoKeys = d.keys || null;
  } else {
    // AI-generated HTML: run it for real
    const frame = document.createElement("iframe");
    frame.setAttribute("sandbox", "allow-scripts");
    frame.srcdoc = prog.code;
    runBody.appendChild(frame);
  }

  demoCleanup = function () {
    document.removeEventListener("keydown", onKey, true);
    if (innerCleanup) innerCleanup();
  };
}

function closeDemo() {
  if (demoCleanup) { demoCleanup(); demoCleanup = null; }
  runBody.innerHTML = "";
  runOverlay.classList.add("hidden");
}
document.getElementById("runClose").addEventListener("click", closeDemo);

/* ---- the demos ---- */
const DEMOS = {

  life: function () {
    const size = fitSquare();
    const cell = 7;
    const W = Math.max(20, Math.floor(size / cell));
    const H = W;
    const cv = makeCanvas(W * cell, H * cell);
    const ctx = cv.getContext("2d");
    let grid = [];
    for (let y = 0; y < H; y++) {
      grid.push([]);
      for (let x = 0; x < W; x++) grid[y].push(Math.random() < 0.25);
    }
    function step() {
      const next = [];
      for (let y = 0; y < H; y++) {
        next.push([]);
        for (let x = 0; x < W; x++) {
          let n = 0;
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            if (dx || dy) n += grid[(y + dy + H) % H][(x + dx + W) % W] ? 1 : 0;
          }
          next[y].push(n === 3 || (grid[y][x] && n === 2));
        }
      }
      grid = next;
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = "#39ff9b";
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        if (grid[y][x]) ctx.fillRect(x * cell, y * cell, cell - 1, cell - 1);
      }
    }
    step();
    const timer = setInterval(step, 110);
    return { cleanup: function () { clearInterval(timer); } };
  },

  snake: function () {
    const size = fitSquare();
    const N = 21;
    const cell = Math.max(10, Math.floor(size / N));
    const cv = makeCanvas(N * cell, N * cell);
    const ctx = cv.getContext("2d");
    let snake, dir, nextDir, food, score, dead, timer;

    function reset() {
      snake = [[10, 12], [10, 13], [10, 14]];
      dir = [0, -1]; nextDir = dir;
      score = 0; dead = false;
      placeFood();
    }
    function placeFood() {
      do {
        food = [1 + Math.floor(Math.random() * (N - 2)),
                1 + Math.floor(Math.random() * (N - 2))];
      } while (snake.some(function (s) { return s[0] === food[0] && s[1] === food[1]; }));
    }
    function tick() {
      if (dead) return;
      dir = nextDir;
      const head = [snake[0][0] + dir[0], snake[0][1] + dir[1]];
      const hitSelf = snake.some(function (s) { return s[0] === head[0] && s[1] === head[1]; });
      if (head[0] <= 0 || head[0] >= N - 1 || head[1] <= 0 || head[1] >= N - 1 || hitSelf) {
        dead = true; draw(); return;
      }
      snake.unshift(head);
      if (head[0] === food[0] && head[1] === food[1]) { score++; placeFood(); }
      else snake.pop();
      draw();
    }
    function draw() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.strokeStyle = "#2a2a3a";
      ctx.strokeRect(cell / 2, cell / 2, (N - 1) * cell, (N - 1) * cell);
      ctx.fillStyle = "#ff5ea0";
      ctx.fillRect(food[1] * cell + 2, food[0] * cell + 2, cell - 4, cell - 4);
      snake.forEach(function (s, i) {
        ctx.fillStyle = i === 0 ? "#d8ffe9" : "#39ff9b";
        ctx.fillRect(s[1] * cell + 1, s[0] * cell + 1, cell - 2, cell - 2);
      });
      ctx.fillStyle = "#5f6a7d";
      ctx.font = "bold " + Math.max(11, cell * 0.7) + "px monospace";
      ctx.fillText("score: " + score, cell, cell * 0.2 + 10);
      if (dead) {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = "#ff5ea0";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER — score " + score, cv.width / 2, cv.height / 2 - 10);
        ctx.fillStyle = "#9cffb0";
        ctx.fillText("tap or press space to restart", cv.width / 2, cv.height / 2 + 14);
        ctx.textAlign = "left";
      }
    }
    function steer(dy, dx) {
      if (dead) return;
      if (dy === -dir[0] && dx === -dir[1]) return; // no 180s
      nextDir = [dy, dx];
    }
    function keys(e) {
      if (dead && (e.key === " " || e.key === "Enter")) { reset(); return; }
      if (e.key === "ArrowUp" || e.key === "w") steer(-1, 0);
      else if (e.key === "ArrowDown" || e.key === "s") steer(1, 0);
      else if (e.key === "ArrowLeft" || e.key === "a") steer(0, -1);
      else if (e.key === "ArrowRight" || e.key === "d") steer(0, 1);
      e.preventDefault();
    }
    // swipe steering for phones
    let tx = null, ty = null;
    cv.addEventListener("touchstart", function (e) {
      if (dead) { reset(); return; }
      tx = e.touches[0].clientX; ty = e.touches[0].clientY;
    }, { passive: true });
    cv.addEventListener("touchend", function (e) {
      if (tx === null) return;
      const dx = e.changedTouches[0].clientX - tx;
      const dy = e.changedTouches[0].clientY - ty;
      tx = ty = null;
      if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
      if (Math.abs(dx) > Math.abs(dy)) steer(0, dx > 0 ? 1 : -1);
      else steer(dy > 0 ? 1 : -1, 0);
    }, { passive: true });
    cv.addEventListener("click", function () { if (dead) reset(); });

    reset();
    draw();
    timer = setInterval(tick, 115);
    return { cleanup: function () { clearInterval(timer); }, keys: keys };
  },

  mandelbrot: function () {
    // same math, same shades as mandelbrot.c
    const COLS = 100, ROWS = 38, MAX_ITER = 96;
    const SHADES = " .:-=+*#%@";
    let out = "";
    for (let row = 0; row < ROWS; row++) {
      const ci = -1.2 + 2.4 * row / (ROWS - 1);
      for (let col = 0; col < COLS; col++) {
        const cr = -2.1 + 3.0 * col / (COLS - 1);
        let zr = 0, zi = 0, zr2 = 0, zi2 = 0, i = 0;
        for (; i < MAX_ITER; i++) {
          zi = 2 * zr * zi + ci;
          zr = zr2 - zi2 + cr;
          zr2 = zr * zr; zi2 = zi * zi;
          if (zr2 + zi2 > 4) break;
        }
        out += SHADES[i === MAX_ITER ? 9 : i % 10];
      }
      out += "\n";
    }
    const pre = document.createElement("pre");
    pre.textContent = out;
    runBody.appendChild(pre);
    return { cleanup: function () {} };
  },

  matrix: function () {
    const cv = makeCanvas(runBody.clientWidth - 8, runBody.clientHeight - 8);
    const ctx = cv.getContext("2d");
    const GLYPHS = "01ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄABCDEFXYZ<>*+-=";
    const fs = 16;
    const cols = Math.floor(cv.width / fs);
    const drops = [];
    for (let i = 0; i < cols; i++) drops.push(Math.random() * -40);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, cv.width, cv.height);
    function frame() {
      ctx.fillStyle = "rgba(0,0,0,0.08)";
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.font = fs + "px monospace";
      for (let i = 0; i < cols; i++) {
        const g = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
        ctx.fillStyle = "#e8ffe8";
        ctx.fillText(g, i * fs, drops[i] * fs);
        ctx.fillStyle = "#0f8";
        ctx.fillText(GLYPHS[Math.floor(Math.random() * GLYPHS.length)],
                     i * fs, (drops[i] - 1) * fs);
        if (drops[i] * fs > cv.height && Math.random() > 0.975) drops[i] = 0;
        drops[i] += 0.5 + Math.random() * 0.3;
      }
    }
    const timer = setInterval(frame, 50);
    return { cleanup: function () { clearInterval(timer); } };
  },

  raytracer: function () {
    // JS port of raytracer.py: same spheres, same light, same shading
    const W = 320, H = 240;
    const LIGHT = norm([-0.6, 0.8, -0.5]);
    const SPHERES = [
      [0.0, -0.2, 3.0, 0.8, [255, 80, 120]],
      [-1.4, 0.1, 3.6, 0.6, [90, 200, 255]],
      [1.3, 0.0, 3.4, 0.7, [255, 210, 80]],
    ];
    function norm(v) {
      const n = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]);
      return [v[0] / n, v[1] / n, v[2] / n];
    }
    function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    function hit(d, s) {
      const oc = [-s[0], -s[1], -s[2]];
      const b = 2 * dot(oc, d);
      const c = dot(oc, oc) - s[3] * s[3];
      const disc = b * b - 4 * c;
      if (disc < 0) return null;
      const t = (-b - Math.sqrt(disc)) / 2;
      return t > 0.001 ? t : null;
    }
    const cv = makeCanvas(W, H);
    const scale = Math.min((runBody.clientWidth - 8) / W, (runBody.clientHeight - 8) / H);
    cv.style.width = Math.floor(W * scale) + "px";
    cv.style.height = Math.floor(H * scale) + "px";
    const ctx = cv.getContext("2d");
    const img = ctx.createImageData(W, H);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const d = norm([(2 * x / W - 1) * (W / H), 1 - 2 * y / H, 1.6]);
        let best = Infinity, nearest = null;
        for (const s of SPHERES) {
          const t = hit(d, s);
          if (t !== null && t < best) { best = t; nearest = s; }
        }
        let r, g, b;
        if (!nearest) {
          const fade = 0.5 * (d[1] + 1);
          r = 20 + 40 * fade; g = 20 + 40 * fade; b = 40 + 80 * fade;
        } else {
          const p = [d[0] * best, d[1] * best, d[2] * best];
          const nv = norm([p[0] - nearest[0], p[1] - nearest[1], p[2] - nearest[2]]);
          const lam = Math.max(0, dot(nv, LIGHT));
          const spec = Math.pow(lam, 24);
          r = Math.min(255, nearest[4][0] * (0.15 + 0.85 * lam) + 200 * spec);
          g = Math.min(255, nearest[4][1] * (0.15 + 0.85 * lam) + 200 * spec);
          b = Math.min(255, nearest[4][2] * (0.15 + 0.85 * lam) + 200 * spec);
        }
        const o = (y * W + x) * 4;
        img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    return { cleanup: function () {} };
  },

  server: function () {
    const pre = document.createElement("pre");
    pre.style.alignSelf = "flex-start";
    runBody.appendChild(pre);
    const timers = [];
    function line(txt, delay) {
      timers.push(setTimeout(function () {
        pre.textContent += txt + "\n";
      }, delay));
    }
    const t0 = new Date().toISOString();
    line("listening on http://localhost:8080", 300);
    line("", 400);
    line(t0 + " GET /", 1100);
    line(t0 + " GET /api/status", 2000);
    line("", 2100);
    line("$ curl http://localhost:8080/api/status", 2600);
    line(JSON.stringify({ ok: true, uptimeSeconds: 4, hits: 2,
      node: "v22.22.2" }, null, 2), 3300);
    line("", 3400);
    line(t0 + " GET /api/echo?msg=hello", 4400);
    line("$ curl 'http://localhost:8080/api/echo?msg=hello'", 4900);
    line(JSON.stringify({ msg: "hello" }, null, 2), 5500);
    return { cleanup: function () { timers.forEach(clearTimeout); } };
  },
};

/* =====================================================================
   Keyboard — the whole point
   =====================================================================
   Two input paths that never double-count:
   - Hardware keyboards: the document keydown handler reveals code and
     calls preventDefault(), so the ghost input never changes and no
     `input` event fires.
   - Mobile software keyboards (iOS/Android): keys that reach keydown as
     "Unidentified"/229 (or swipe-typed words) fall through to the ghost
     input's `input` event, which reveals code instead.
   The ghost input exists because phones only show a keyboard when a
   text field is focused. */
const ghost = document.getElementById("ghost");
const GHOST_PAD = "·";  // gives mobile backspace something to delete

function focusGhost() {
  ghost.value = GHOST_PAD;
  ghost.focus({ preventScroll: true });
  ghost.setSelectionRange(ghost.value.length, ghost.value.length);
}

ghost.addEventListener("input", function (e) {
  if (!running) { ghost.value = GHOST_PAD; return; }
  if (e.inputType === "deleteContentBackward") {
    unrevealChars(1);
  } else {
    revealNow(1);  // even a swipe-typed word counts as one keystroke
  }
  ghost.value = GHOST_PAD;
  ghost.setSelectionRange(ghost.value.length, ghost.value.length);
});

// tapping the code screen brings the keyboard back if it was dismissed
screen.addEventListener("click", function () {
  if (running) focusGhost();
});

document.getElementById("menuBtn").addEventListener("click", function () {
  if (running) openMenu();
});

document.addEventListener("keydown", function (e) {
  if (!running) {
    if (e.key === "Enter" && e.target.id !== "describe" &&
        e.target.id !== "apiKey") start();
    return;
  }
  if (e.key === "Escape") {
    openMenu();
    return;
  }
  // once the program is finished, Enter runs it
  if (finished && e.key === "Enter") {
    e.preventDefault();
    runDemo();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return; // let shortcuts through
  if (e.key === "Backspace") {
    e.preventDefault();
    unrevealChars(1);
    return;
  }
  // any printable key, Enter, Space, Tab — all produce exactly one character
  if (e.key.length === 1 || e.key === "Enter" || e.key === "Tab") {
    e.preventDefault();
    revealNow(1);
  }
});
</script>
</body>
